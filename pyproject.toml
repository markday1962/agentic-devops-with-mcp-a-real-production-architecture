[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-devops"
version = "0.1.0"
description = "Production agentic DevOps architecture: orchestration, MCP tools, approval gates, memory, observability"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7",
    "mcp>=2.2",
    "fastapi>=0.115",
]

[project.scripts]
approvals = "agentic_devops.approval.cli:main"
knowledge = "agentic_devops.memory.cli:main"

[project.optional-dependencies]
slack = ["slack_sdk>=3.27"]
dev = ["pytest>=8.0", "ruff>=0.6", "opentelemetry-sdk>=1.27"]
serve = ["uvicorn>=0.30"]
voyage = ["voyageai>=0.3"]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
